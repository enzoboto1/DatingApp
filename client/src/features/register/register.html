<div class="card w-full max-w-md p-6 shadow-md">
  <h2 class="text-2xl mb-4">Register</h2>
  <form (ngSubmit)="register()" #regForm="ngForm" class="flex flex-col gap-3">
    <input [(ngModel)]="model.displayName" name="displayName" placeholder="Display name" class="input" required />
    <input [(ngModel)]="model.email" name="email" placeholder="Email" class="input" required />
    <input [(ngModel)]="model.password" name="password" type="password" placeholder="Password" class="input" required />
    <div class="flex gap-3 justify-end">
      <button type="button" (click)="cancel()" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Register</button>
    </div>
  </form>
</div>
